name: Deploy Staging

on:
  push:
    branches:
      - staging
      - 'feature/**'
      - 'test/**'
      - 'dev/**'
      - 'develop'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build (staging)
        run: npm run build
        env:
          VITE_BASE: /dashboard-weex/staging/

      - name: Prepare gh-pages with staging
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages 2>/dev/null && \
            git worktree add /tmp/gh-pages origin/gh-pages || \
            mkdir -p /tmp/gh-pages

          rm -rf /tmp/gh-pages/staging
          cp -r dist /tmp/gh-pages/staging
          touch /tmp/gh-pages/.nojekyll

          cd /tmp/gh-pages
          git add -A
          git commit -m "[staging] ${{ github.ref_name }} @ $(echo ${{ github.sha }} | cut -c1-7)" || echo "Nothing to commit"
          git push origin HEAD:gh-pages

      - name: Print staging URL
        run: |
          echo "──────────────────────────────────────────────────────"
          echo "✅  Staging déployé !"
          echo "🔗  https://${{ github.repository_owner }}.github.io/dashboard-weex/staging/"
          echo "🌿  Branche : ${{ github.ref_name }}"
          echo "──────────────────────────────────────────────────────"
