name: Deploy Staging

on:
  push:
    branches:
      - staging
      - 'feature/**'
      - 'test/**'
      - 'dev/**'
      - 'develop'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build (staging)
        run: npm run build
        env:
          VITE_BASE: /dashboard-weex/staging/

      - name: Save staging build to staging-build branch
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          BUILD_DIR="$GITHUB_WORKSPACE/dist"

          if git ls-remote --exit-code origin staging-build; then
            git clone --branch staging-build --single-branch \
              "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
              /tmp/staging-build
          else
            mkdir /tmp/staging-build && cd /tmp/staging-build
            git init
            git checkout -b staging-build
            git remote add origin \
              "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            cd "$GITHUB_WORKSPACE"
          fi

          rm -rf /tmp/staging-build/*
          cp -r "$BUILD_DIR/." /tmp/staging-build/
          touch /tmp/staging-build/.nojekyll

          cd /tmp/staging-build
          git add -A
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "[staging-build] ${{ github.ref_name }} @ $(echo '${{ github.sha }}' | cut -c1-7)"
          git push origin staging-build --force

      - name: Trigger prod deploy to pick up staging
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/.deploy.yml/dispatches" \
            -d '{"ref":"master"}'
        continue-on-error: true

      - name: Print staging URL
        run: |
          echo "✅  Build staging sauvegardé !"
          echo "🔗  https://${{ github.repository_owner }}.github.io/dashboard-weex/staging/"
          echo "⏳  Disponible après le redéploiement de la prod (1-2 min)"
