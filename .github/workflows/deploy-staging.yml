name: Deploy Staging

on:
  push:
    branches:
      - staging
      - 'feature/**'
      - 'test/**'
      - 'dev/**'
      - 'develop'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build (staging)
        run: npm run build
        env:
          VITE_BASE: /dashboard-weex/staging/

      - name: Deploy staging into gh-pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Clone gh-pages dans /tmp/ghp (ou crée un repo vide si elle n'existe pas)
          if git ls-remote --exit-code origin gh-pages; then
            git clone --branch gh-pages --single-branch "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /tmp/ghp
          else
            mkdir /tmp/ghp
            cd /tmp/ghp
            git init
            git checkout -b gh-pages
            touch .nojekyll
            git add .nojekyll
            git commit -m "init gh-pages"
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          fi

          # Injecte le build dans /staging/ sans toucher le reste
          rm -rf /tmp/ghp/staging
          cp -r dist /tmp/ghp/staging
          touch /tmp/ghp/.nojekyll

          cd /tmp/ghp
          git add -A
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "[staging] ${{ github.ref_name }} @ $(echo '${{ github.sha }}' | cut -c1-7)"
          git push origin gh-pages

      - name: Print staging URL
        run: |
          echo "✅  Staging déployé !"
          echo "🔗  https://${{ github.repository_owner }}.github.io/dashboard-weex/staging/"
