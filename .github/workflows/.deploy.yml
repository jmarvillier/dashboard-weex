name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build prod
        run: npm run build

      - name: Print build info
        run: |
          echo "Version : $(node -p "require('./package.json').version")"
          echo "SHA Git  : $(git rev-parse --short=7 HEAD)"

      - name: Inject staging build into dist
        run: |
          if git ls-remote --exit-code origin staging-build; then
            echo "✅ staging-build trouvé → clone dans dist/staging/"
            git clone --branch staging-build --single-branch \
              "https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git" \
              dist/staging
            rm -rf dist/staging/.git
            echo "Staging injecté dans dist/staging/"
            ls dist/staging/ | head -5
          else
            echo "ℹ️ Pas de staging-build, on déploie sans"
          fi
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
