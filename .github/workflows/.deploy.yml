name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build prod
        run: npm run build

      - name: Print build info
        run: |
          echo "Version : $(node -p "require('./package.json').version")"
          echo "SHA Git  : $(git rev-parse --short=7 HEAD)"

      - name: Restore staging from gh-pages
        run: |
          git fetch origin gh-pages 2>/dev/null || true
          if git show origin/gh-pages:staging/index.html > /dev/null 2>&1; then
            echo "Staging trouvé → copie dans dist/staging/"
            git --work-tree=dist/staging checkout origin/gh-pages -- staging/
            mv dist/staging/staging/* dist/staging/ 2>/dev/null || true
            rm -rf dist/staging/staging
            echo "✅ Staging restauré"
          else
            echo "ℹ️ Pas de staging existant, on continue sans"
          fi
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
