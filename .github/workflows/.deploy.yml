name: Deploy to GitHub Pages

on:
  push:
    branches:
      - developa
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 est nécessaire pour que git rev-parse --short HEAD
          # retourne le vrai SHA du commit (pas juste "HEAD détaché")
          fetch-depth: 1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        # Le SHA Git est lu automatiquement par vite.config.js via git rev-parse

      - name: Print build info
        run: |
          echo "Version : $(node -p "require('./package.json').version")"
          echo "SHA Git  : $(git rev-parse --short=7 HEAD)"
          echo "Cache key: weex-$(node -p "require('./package.json').version")-$(git rev-parse --short=7 HEAD)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
